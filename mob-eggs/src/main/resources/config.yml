# List of entity types that you cannot put into eggs.
# Players, bosses (wither, ender dragon) and mobs that have no vanilla spawn egg
# are always refused and don't need listing here. A mob in a stack can be caught:
# its riders, players included, get off, and whatever it was riding carries on.
blacklist:
  - "vex"
  - "vindicator"
  - "evoker"
